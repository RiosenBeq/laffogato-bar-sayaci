# LAFFOGATO — container ile çalıştırma.
#   docker compose up -d     → başlat
#   docker compose logs -f   → günlük
#   docker compose down      → durdur
#
# KAMERA UYARISI: Docker Desktop (Mac/Windows) bilgisayarın kamerasını
# container'a VEREMEZ. .env dosyasında KAYNAK=0 yazıyorsa container'da
# çalışmaz; RTSP adresi ya da video dosyası kullanın.
# Linux'ta USB kamera için aşağıdaki 'devices' bloğunu açın.

services:
  laffogato:
    build: .
    image: laffogatopped
    ports:
      # YALNIZCA bu bilgisayara açık. "8100:8100" yapılırsa kafedeki wifi'ye
      # bağlanan herkes barı canlı izleyebilir ve görüntü kaynağını
      # değiştirebilir; PANEL_SIFRESI boşsa hiçbir engel yoktur.
      - "127.0.0.1:8100:8100"
    volumes:
      - ./veri:/uygulama/veri          # veritabanı, görüntüler, nesne kütüphanesi
      - ./.env:/uygulama/.env:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://127.0.0.1:8100/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

    # --- Linux'ta USB/yerleşik kamera (Mac ve Windows'ta ÇALIŞMAZ) ---
    # devices:
    #   - "/dev/video0:/dev/video0"
